<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>鹈鹕骑自行车 2D SVG 动画</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      user-select: none;
      overflow-x: hidden;
    }
    .glass-panel {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }
    .dark-panel {
      background: rgba(15, 23, 42, 0.82);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }
  </style>
</head>
<body class="min-h-screen bg-slate-900 text-slate-800 flex flex-col items-center justify-center p-3 sm:p-6 transition-colors duration-700" id="app-body">

  <!-- Main Container -->
  <div class="w-full max-w-5xl rounded-3xl shadow-2xl overflow-hidden border border-white/20 bg-white/5 flex flex-col">
    
    <!-- Top Header -->
    <div class="px-5 py-3.5 flex flex-wrap items-center justify-between gap-3 bg-slate-900/90 text-white border-b border-white/10">
      <div class="flex items-center gap-3">
        <span class="inline-flex items-center justify-center w-9 h-9 rounded-xl bg-amber-500/20 text-amber-400 font-bold text-lg">🦤</span>
        <div>
          <h1 class="text-base sm:text-lg font-bold tracking-tight flex items-center gap-2">
            鹈鹕骑车漫游记
            <span id="mode-badge" class="text-xs px-2.5 py-0.5 rounded-full bg-teal-500/20 text-teal-300 font-medium border border-teal-400/30">海滨巡航</span>
          </h1>
          <p class="text-xs text-slate-400">2D 骨骼逆运动学 (IK) 实时计算的纯 SVG 骑行动画</p>
        </div>
      </div>

      <!-- Quick Action Buttons -->
      <div class="flex flex-wrap items-center gap-2">
        <button id="btn-bell" class="px-3 py-1.5 rounded-xl bg-amber-500 hover:bg-amber-400 active:scale-95 text-slate-950 font-semibold text-xs sm:text-sm transition flex items-center gap-1.5 shadow-sm">
          <span>🔔</span> 按车铃
        </button>
        <button id="btn-fish" class="px-3 py-1.5 rounded-xl bg-sky-500 hover:bg-sky-400 active:scale-95 text-slate-950 font-semibold text-xs sm:text-sm transition flex items-center gap-1.5 shadow-sm">
          <span>🐟</span> 投喂小鱼
        </button>
        <button id="btn-study" class="px-3 py-1.5 rounded-xl bg-indigo-500/30 hover:bg-indigo-500/50 border border-indigo-400/40 active:scale-95 text-indigo-200 font-semibold text-xs sm:text-sm transition flex items-center gap-1.5">
          <span>📖</span> <span id="study-label">切换「自习车」彩蛋</span>
        </button>
        <button id="btn-theme" class="px-3 py-1.5 rounded-xl bg-slate-800 hover:bg-slate-700 border border-slate-600 active:scale-95 text-slate-200 font-medium text-xs sm:text-sm transition flex items-center gap-1.5">
          <span id="theme-icon">☀️</span> <span id="theme-label">晴日</span>
        </button>
      </div>
    </div>

    <!-- SVG Stage -->
    <div class="relative w-full aspect-[16/10] sm:aspect-[16/9] overflow-hidden bg-sky-200" id="stage-wrapper">
      <svg id="scene-svg" viewBox="0 0 1000 580" class="w-full h-full block" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <!-- Sky Gradients -->
          <linearGradient id="sky-day" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#38bdf8" />
            <stop offset="55%" stop-color="#bae6fd" />
            <stop offset="100%" stop-color="#fef9c3" />
          </linearGradient>
          <linearGradient id="sky-sunset" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#311042" />
            <stop offset="40%" stop-color="#9d174d" />
            <stop offset="75%" stop-color="#f97316" />
            <stop offset="100%" stop-color="#fde047" />
          </linearGradient>
          <linearGradient id="sky-night" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#020617" />
            <stop offset="55%" stop-color="#0f172a" />
            <stop offset="100%" stop-color="#1e293b" />
          </linearGradient>

          <!-- Sea Gradient -->
          <linearGradient id="sea-grad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#0284c7" />
            <stop offset="100%" stop-color="#0369a1" />
          </linearGradient>

          <!-- Pelican Pouch Gradient -->
          <linearGradient id="pouch-grad" x1="0%" y1="0%" x2="10%" y2="100%">
            <stop offset="0%" stop-color="#fbbf24" />
            <stop offset="55%" stop-color="#f59e0b" />
            <stop offset="100%" stop-color="#ea580c" />
          </linearGradient>

          <!-- Beak Upper Gradient -->
          <linearGradient id="beak-grad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#fde047" />
            <stop offset="70%" stop-color="#facc15" />
            <stop offset="100%" stop-color="#f97316" />
          </linearGradient>

          <!-- Feather Body Gradient -->
          <linearGradient id="body-grad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#ffffff" />
            <stop offset="75%" stop-color="#f1f5f9" />
            <stop offset="100%" stop-color="#cbd5e1" />
          </linearGradient>

          <!-- Bike Frame Gradient -->
          <linearGradient id="frame-grad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#2dd4bf" />
            <stop offset="50%" stop-color="#0d9488" />
            <stop offset="100%" stop-color="#115e59" />
          </linearGradient>

          <!-- Headlight Beam Gradient -->
          <linearGradient id="beam-grad" x1="0%" y1="50%" x2="100%" y2="50%">
            <stop offset="0%" stop-color="#fef08a" stop-opacity="0.75" />
            <stop offset="60%" stop-color="#fef08a" stop-opacity="0.25" />
            <stop offset="100%" stop-color="#fef08a" stop-opacity="0" />
          </linearGradient>

          <!-- Drop Shadow -->
          <filter id="soft-shadow" x="-15%" y="-15%" width="130%" height="130%">
            <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.18" />
          </filter>
        </defs>

        <!-- 1. SKY BACKGROUND -->
        <rect id="sky-rect" x="0" y="0" width="1000" height="440" fill="url(#sky-day)" />

        <!-- Stars (visible at night/sunset) -->
        <g id="stars-group" opacity="0">
          <circle cx="120" cy="60" r="1.8" fill="#fff" />
          <circle cx="240" cy="95" r="1.2" fill="#fff" />
          <circle cx="350" cy="40" r="2.2" fill="#fef08a" />
          <circle cx="480" cy="80" r="1.5" fill="#fff" />
          <circle cx="620" cy="50" r="2.0" fill="#fff" />
          <circle cx="770" cy="105" r="1.4" fill="#fff" />
          <circle cx="890" cy="45" r="2.2" fill="#fef08a" />
          <circle cx="940" cy="110" r="1.5" fill="#fff" />
          <circle cx="70" cy="140" r="1.3" fill="#fff" />
          <circle cx="530" cy="135" r="1.7" fill="#fff" />
        </g>

        <!-- Sun / Moon -->
        <g id="celestial-body" transform="translate(820, 95)">
          <circle id="sun-glow" cx="0" cy="0" r="56" fill="#fef08a" opacity="0.35" />
          <circle id="sun-core" cx="0" cy="0" r="40" fill="#fde047" />
        </g>

        <!-- 2. PARALLAX CLOUDS -->
        <g id="clouds-layer" opacity="0.9">
          <g class="cloud" data-speed="0.25" transform="translate(120, 75)">
            <path d="M0,30 Q15,5 40,15 Q60,-10 90,10 Q120,5 130,30 Z" fill="#ffffff" opacity="0.85" />
          </g>
          <g class="cloud" data-speed="0.18" transform="translate(480, 110) scale(0.85)">
            <path d="M0,30 Q15,5 40,15 Q60,-10 90,10 Q120,5 130,30 Z" fill="#ffffff" opacity="0.75" />
          </g>
          <g class="cloud" data-speed="0.32" transform="translate(790, 65) scale(1.15)">
            <path d="M0,30 Q15,5 40,15 Q60,-10 90,10 Q120,5 130,30 Z" fill="#ffffff" opacity="0.9" />
          </g>
        </g>

        <!-- Distant Flying Seagulls -->
        <g id="seagulls-layer">
          <path id="gull-1" d="M0,0 Q10,-12 20,0 Q30,-12 40,0" fill="none" stroke="#475569" stroke-width="2.5" stroke-linecap="round" transform="translate(260, 125) scale(0.7)" />
          <path id="gull-2" d="M0,0 Q10,-12 20,0 Q30,-12 40,0" fill="none" stroke="#475569" stroke-width="2.5" stroke-linecap="round" transform="translate(310, 145) scale(0.5)" />
        </g>

        <!-- 3. DISTANT ISLANDS & LIGHTHOUSE -->
        <g id="island-layer" transform="translate(0, 315)">
          <path d="M -50,60 Q 80,-10 230,60 Z" fill="#64748b" opacity="0.35" />
          <path d="M 550,60 Q 720,-25 890,60 Z" fill="#475569" opacity="0.3" />
          <!-- Lighthouse on island -->
          <g id="lighthouse" transform="translate(710, -22)">
            <polygon points="-8,45 -5,0 5,0 8,45" fill="#f8fafc" />
            <polygon points="-6.5,25 -5.5,12 5.5,12 6.5,25" fill="#ef4444" />
            <rect x="-7" y="-5" width="14" height="5" rx="1" fill="#1e293b" />
            <polygon points="-9,-5 0,-14 9,-5" fill="#ef4444" />
            <circle cx="0" cy="-2.5" r="3" fill="#fef08a" />
          </g>
        </g>

        <!-- 4. OCEAN & WAVES -->
        <rect id="ocean-rect" x="0" y="365" width="1000" height="80" fill="url(#sea-grad)" />
        <g id="waves-layer" stroke="#7dd3fc" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.65">
          <path class="wave-line" data-x="50" d="M 50,385 Q 70,378 90,385 T 130,385" />
          <path class="wave-line" data-x="290" d="M 290,405 Q 310,398 330,405 T 370,405" />
          <path class="wave-line" data-x="540" d="M 540,388 Q 560,381 580,388 T 620,388" />
          <path class="wave-line" data-x="790" d="M 790,410 Q 810,403 830,410 T 870,410" />
          <path class="wave-line" data-x="960" d="M 960,382 Q 980,375 1000,382 T 1040,382" />
        </g>

        <!-- 5. BOARDWALK / PROMENADE & PALM TREES -->
        <g id="scenery-bg-layer">
          <!-- Scrolling Palm Trees / Street Lamps -->
          <g id="palm-1" transform="translate(180, 420)">
            <!-- Trunk -->
            <path d="M 0,0 Q -12,-70 -28,-135" stroke="#78350f" stroke-width="11" stroke-linecap="round" fill="none" />
            <path d="M 0,0 Q -12,-70 -28,-135" stroke="#92400e" stroke-width="7" stroke-dasharray="6 8" stroke-linecap="round" fill="none" />
            <!-- Fronds -->
            <g transform="translate(-28, -135)">
              <path d="M0,0 Q-45,-15 -65,15 Q-30,5 0,0" fill="#15803d" />
              <path d="M0,0 Q-30,-40 -60,-25 Q-25,-15 0,0" fill="#16a34a" />
              <path d="M0,0 Q10,-45 50,-30 Q20,-15 0,0" fill="#22c55e" />
              <path d="M0,0 Q45,-15 65,20 Q25,5 0,0" fill="#15803d" />
              <path d="M0,0 Q15,20 35,40 Q5,20 0,0" fill="#166534" />
            </g>
          </g>

          <g id="palm-2" transform="translate(680, 420) scale(0.85)">
            <path d="M 0,0 Q 10,-70 22,-135" stroke="#78350f" stroke-width="11" stroke-linecap="round" fill="none" />
            <g transform="translate(22, -135)">
              <path d="M0,0 Q-45,-15 -65,15 Q-30,5 0,0" fill="#15803d" />
              <path d="M0,0 Q-30,-40 -60,-25 Q-25,-15 0,0" fill="#22c55e" />
              <path d="M0,0 Q10,-45 50,-30 Q20,-15 0,0" fill="#16a34a" />
              <path d="M0,0 Q45,-15 65,20 Q25,5 0,0" fill="#15803d" />
            </g>
          </g>
        </g>

        <!-- Wooden Railing & Curb -->
        <rect x="0" y="415" width="1000" height="12" fill="#e2e8f0" />
        <g id="railing-posts"></g>
        <rect x="0" y="427" width="1000" height="153" fill="#334155" />
        <!-- Sidewalk edge -->
        <rect x="0" y="427" width="1000" height="16" fill="#94a3b8" />
        <line x1="0" y1="443" x2="1000" y2="443" stroke="#cbd5e1" stroke-width="2" />

        <!-- Road Center Dashed Line -->
        <line id="road-dashes" x1="-200" y1="510" x2="1200" y2="510" stroke="#facc15" stroke-width="6" stroke-dasharray="48 48" stroke-linecap="round" opacity="0.85" />

        <!-- Ground Shadow under Bike -->
        <ellipse id="bike-shadow" cx="500" cy="508" rx="195" ry="14" fill="#0f172a" opacity="0.35" />

        <!-- ============================================================ -->
        <!-- 6. PELICAN & BICYCLE RIG (Centered around X=500, Y=300..500) -->
        <!-- ============================================================ -->
        <g id="rig-root" filter="url(#soft-shadow)">
          
          <!-- Night Headlight Beam (Initially hidden) -->
          <polygon id="headlight-beam" points="602,282 990,220 990,460" fill="url(#beam-grad)" opacity="0" style="mix-blend-mode: screen;" />

          <!-- A. BACK LEG (Left Leg of Pelican - behind bike frame) -->
          <g id="left-leg-layer">
            <!-- Thigh -->
            <line id="l-thigh" x1="418" y1="276" x2="450" y2="340" stroke="#cbd5e1" stroke-width="18" stroke-linecap="round" />
            <!-- Shin (Orange pelican leg) -->
            <line id="l-shin" x1="450" y1="340" x2="475" y2="420" stroke="#ea580c" stroke-width="10" stroke-linecap="round" />
            <circle id="l-knee" cx="450" cy="340" r="6" fill="#ea580c" />
            <!-- Webbed Foot (Left) -->
            <g id="l-foot" transform="translate(475, 420)">
              <path d="M -8,0 L 28,4 L 36,-5 L 24,-8 L -6,-5 Z" fill="#ea580c" stroke="#c2410c" stroke-width="1.5" stroke-linejoin="round" />
              <!-- Back Pedal -->
              <rect x="-14" y="3" width="32" height="7" rx="3" fill="#334155" stroke="#94a3b8" stroke-width="1.5" />
            </g>
            <!-- Left Crank Arm (behind chainring) -->
            <line id="l-crank" x1="475" y1="420" x2="475" y2="380" stroke="#64748b" stroke-width="7" stroke-linecap="round" />
          </g>

          <!-- B. BICYCLE WHEELS -->
          <!-- Rear Wheel (Center: 340, 420, Radius: 78) -->
          <g id="rear-wheel" transform="translate(340, 420)">
            <!-- Tire -->
            <circle cx="0" cy="0" r="78" fill="none" stroke="#1e293b" stroke-width="14" />
            <!-- Whitewall / Rim stripe -->
            <circle cx="0" cy="0" r="70" fill="none" stroke="#e2e8f0" stroke-width="4" />
            <circle cx="0" cy="0" r="66" fill="none" stroke="#0d9488" stroke-width="2.5" />
            <!-- Rotating Spokes Group -->
            <g id="rear-spokes">
              <line x1="-66" y1="0" x2="66" y2="0" stroke="#cbd5e1" stroke-width="2" />
              <line x1="0" y1="-66" x2="0" y2="66" stroke="#cbd5e1" stroke-width="2" />
              <line x1="-46.6" y1="-46.6" x2="46.6" y2="46.6" stroke="#cbd5e1" stroke-width="2" />
              <line x1="-46.6" y1="46.6" x2="46.6" y2="-46.6" stroke="#cbd5e1" stroke-width="2" />
              <line x1="-61" y1="-25" x2="61" y2="25" stroke="#cbd5e1" stroke-width="1.5" />
              <line x1="-25" y1="-61" x2="25" y2="61" stroke="#cbd5e1" stroke-width="1.5" />
              <line x1="25" y1="-61" x2="-25" y2="61" stroke="#cbd5e1" stroke-width="1.5" />
              <line x1="61" y1="-25" x2="-61" y2="25" stroke="#cbd5e1" stroke-width="1.5" />
              <!-- Valve & Reflector -->
              <rect x="42" y="-4" width="10" height="6" rx="2" fill="#f59e0b" />
            </g>
            <!-- Rear Hub -->
            <circle cx="0" cy="0" r="14" fill="#475569" stroke="#cbd5e1" stroke-width="3" />
          </g>

          <!-- Front Wheel (Center: 650, 420, Radius: 78) -->
          <g id="front-wheel" transform="translate(650, 420)">
            <!-- Tire -->
            <circle cx="0" cy="0" r="78" fill="none" stroke="#1e293b" stroke-width="14" />
            <!-- Whitewall / Rim stripe -->
            <circle cx="0" cy="0" r="70" fill="none" stroke="#e2e8f0" stroke-width="4" />
            <circle cx="0" cy="0" r="66" fill="none" stroke="#0d9488" stroke-width="2.5" />
            <!-- Rotating Spokes Group -->
            <g id="front-spokes">
              <line x1="-66" y1="0" x2="66" y2="0" stroke="#cbd5e1" stroke-width="2" />
              <line x1="0" y1="-66" x2="0" y2="66" stroke="#cbd5e1" stroke-width="2" />
              <line x1="-46.6" y1="-46.6" x2="46.6" y2="46.6" stroke="#cbd5e1" stroke-width="2" />
              <line x1="-46.6" y1="46.6" x2="46.6" y2="-46.6" stroke="#cbd5e1" stroke-width="2" />
              <line x1="-61" y1="-25" x2="61" y2="25" stroke="#cbd5e1" stroke-width="1.5" />
              <line x1="-25" y1="-61" x2="25" y2="61" stroke="#cbd5e1" stroke-width="1.5" />
              <line x1="25" y1="-61" x2="-25" y2="61" stroke="#cbd5e1" stroke-width="1.5" />
              <line x1="61" y1="-25" x2="-61" y2="25" stroke="#cbd5e1" stroke-width="1.5" />
              <!-- Reflector -->
              <rect x="-52" y="-4" width="10" height="6" rx="2" fill="#f59e0b" />
            </g>
            <!-- Front Hub -->
            <circle cx="0" cy="0" r="11" fill="#475569" stroke="#cbd5e1" stroke-width="3" />
          </g>

          <!-- C. DRIVETRAIN & BICYCLE FRAME -->
          <g id="bike-frame-layer">
            <!-- Rear Fender -->
            <path d="M 255,410 A 86,86 0 0,1 415,375" fill="none" stroke="#0f766e" stroke-width="8" stroke-linecap="round" />
            <!-- Front Fender -->
            <path d="M 575,380 A 86,86 0 0,1 725,380" fill="none" stroke="#0f766e" stroke-width="8" stroke-linecap="round" />

            <!-- Drive Chain (Animated stroke-dashoffset) -->
            <path id="bike-chain" d="M 340,407 L 475,394 A 26,26 0 1,1 475,446 L 340,433 A 13,13 0 1,1 340,407 Z" 
                  fill="none" stroke="#334155" stroke-width="4.5" stroke-dasharray="6 5" />

            <!-- Frame Tubes -->
            <!-- Chainstay (Rear hub 340,420 to Bottom Bracket 475,420) -->
            <line x1="340" y1="420" x2="475" y2="420" stroke="url(#frame-grad)" stroke-width="10" stroke-linecap="round" />
            <!-- Seatstay (Rear hub 340,420 to Seat Cluster 425,305) -->
            <line x1="340" y1="420" x2="425" y2="305" stroke="url(#frame-grad)" stroke-width="9" stroke-linecap="round" />
            <!-- Down Tube (Bottom Bracket 475,420 to Head Tube 582,298) -->
            <line x1="475" y1="420" x2="582" y2="298" stroke="url(#frame-grad)" stroke-width="12" stroke-linecap="round" />
            <!-- Seat Tube (Bottom Bracket 475,420 to Seat Cluster 418,285) -->
            <line x1="475" y1="420" x2="420" y2="290" stroke="#94a3b8" stroke-width="9" stroke-linecap="round" />
            <line x1="475" y1="420" x2="425" y2="302" stroke="url(#frame-grad)" stroke-width="12" stroke-linecap="round" />
            <!-- Top Tube (Seat Cluster 425,305 to Head Tube 576,282) -->
            <path d="M 425,305 Q 505,302 576,282" fill="none" stroke="url(#frame-grad)" stroke-width="11" stroke-linecap="round" />

            <!-- Front Fork (Head Tube 580,295 to Front Hub 650,420) -->
            <path d="M 578,290 Q 608,358 650,420" fill="none" stroke="url(#frame-grad)" stroke-width="11" stroke-linecap="round" />
            <!-- Head Tube & Stem -->
            <line x1="570" y1="265" x2="585" y2="305" stroke="#0f766e" stroke-width="14" stroke-linecap="round" />
            <path d="M 570,265 L 558,242 L 535,242" fill="none" stroke="#cbd5e1" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" />

            <!-- Headlamp on Front Fork -->
            <g transform="translate(592, 280)">
              <path d="M -8,-8 L 8,-10 L 8,10 L -8,8 Z" fill="#334155" stroke="#94a3b8" stroke-width="2" />
              <ellipse cx="8" cy="0" rx="3" ry="9" fill="#fef08a" />
            </g>

            <!-- Front Woven Basket -->
            <g id="front-basket" transform="translate(596, 240)">
              <path d="M 0,0 L 42,0 L 34,38 L 6,38 Z" fill="#d97706" stroke="#92400e" stroke-width="2.5" stroke-linejoin="round" />
              <line x1="3" y1="12" x2="39" y2="12" stroke="#92400e" stroke-width="2" />
              <line x1="5" y1="25" x2="36" y2="25" stroke="#92400e" stroke-width="2" />
              <line x1="14" y1="0" x2="14" y2="38" stroke="#92400e" stroke-width="2" />
              <line x1="27" y1="0" x2="27" y2="38" stroke="#92400e" stroke-width="2" />
              <!-- Fish tail sticking out of basket -->
              <g id="basket-fish" transform="translate(22, -4) rotate(15)">
                <path d="M -10,6 Q 0,-10 10,6 Z" fill="#38bdf8" stroke="#0284c7" stroke-width="1.5" />
                <polygon points="0,-6 -8,-16 0,-12 8,-16" fill="#0284c7" />
              </g>
            </g>

            <!-- "Study Mode / 自习车" Book Desk Add-on (Toggled via button) -->
            <g id="study-addon" opacity="0" transform="translate(565, 215)">
              <!-- Mini Book Stand & Stack of Books -->
              <rect x="20" y="12" width="46" height="10" rx="2" fill="#ef4444" stroke="#991b1b" stroke-width="1.5" />
              <rect x="23" y="14" width="40" height="6" fill="#fef2f2" />
              <rect x="24" y="3" width="42" height="9" rx="2" fill="#3b82f6" stroke="#1d4ed8" stroke-width="1.5" />
              <rect x="27" y="5" width="36" height="5" fill="#eff6ff" />
              <!-- Reading Lamp attached to basket -->
              <path d="M 55,12 Q 75,-25 45,-35" fill="none" stroke="#475569" stroke-width="4" stroke-linecap="round" />

  <script>

      // --- DOM Elements ---
      const rThigh = document.getElementById('r-thigh');

      const lThigh = document.getElementById('l-thigh');

      const rearSpokes = document.getElementById('rear-spokes');
      const frontSpokes = document.getElementById('front-spokes');
      const chainringSpokes = document.getElementById('chainring-spokes');
      const bikeChain = document.getElementById('bike-chain');
      const pelicanBodyGroup = document.getElementById('pelican-body-group');
      const pelicanHead = document.getElementById('pelican-head');
      const pelicanPouch = document.getElementById('pelican-pouch');
      const pelicanTail = document.getElementById('pelican-tail');
      const scarfTail = document.getElementById('scarf-tail');
      const pelicanWing = document.getElementById('pelican-wing');
      const pelicanWingDetail = document.getElementById('pelican-wing-detail');
      const eyelid = document.getElementById('eyelid');

      const roadDashes = document.getElementById('road-dashes');

      const clouds = document.querySelectorAll('.cloud');

      const hudRpm = document.getElementById('hud-rpm');

      const railingGroup = document.getElementById('railing-posts');

      // Generate wooden boardwalk railing posts
      const postPositions = [];
      for (let i = 0; i < 12; i++) {
        const x = i * 95;
        postPositions.push(x);
        const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
        rect.setAttribute('x', x);
        rect.setAttribute('y', 392);
        rect.setAttribute('width', 10);
        rect.setAttribute('height', 35);
        rect.setAttribute('rx', 2);
        rect.setAttribute('fill', '#cbd5e1');
        railingGroup.appendChild(rect);
      }
      // Horizontal rail bar
      const railBar = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
      railBar.setAttribute('x', 0);
      railBar.setAttribute('y', 398);
      railBar.setAttribute('width', 1000);
      railBar.setAttribute('height', 6);
      railBar.setAttribute('fill', '#94a3b8');
      railingGroup.appendChild(railBar);

      // --- 2-Bone Analytic Inverse Kinematics (IK) Solver ---
      // Solves knee joint position (kx, ky) given Hip (hx, hy) and Ankle/Pedal (ax, ay)
      // such that the knee bends forward (toward +X) like a bird/cyclist on a bike.
      function solveLegIK(hx, hy, ax, ay, L1, L2) {
        const dx = ax - hx;
        const dy = ay - hy;
        let dist = Math.hypot(dx, dy);
        const maxReach = L1 + L2 - 0.5;
        if (dist > maxReach) dist = maxReach;
        if (dist < Math.abs(L1 - L2) + 0.5) dist = Math.abs(L1 - L2) + 0.5;

        // Law of cosines for angle at hip
        const cosAngle = (L1 * L1 + dist * dist - L2 * L2) / (2 * L1 * dist);
        const clampedCos = Math.max(-1, Math.min(1, cosAngle));
        const baseAngle = Math.atan2(dy, dx);
        const hipOffsetAngle = Math.acos(clampedCos);

        // Subtract offset so knee points forward/upward (smaller angle from +X)
        const kneeAngle = baseAngle - hipOffsetAngle;
        const kx = hx + L1 * Math.cos(kneeAngle);
        const ky = hy + L1 * Math.sin(kneeAngle);
        return { kx, ky };
      }

      // --- Web Audio API Synthesizer for Bell & Gulp Sound ---
      let audioCtx = null;
      function getAudioCtx() {
        if (!audioCtx) {
          const AudioContextClass = window.AudioContext || window.webkitAudioContext;
          if (AudioContextClass) audioCtx = new AudioContextClass();
        }
        if (audioCtx && audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
        return audioCtx;
      }

      function playBellSound() {
        try {
          const ctx = getAudioCtx();
          if (!ctx) return;
          const now = ctx.currentTime;
          [1567.98, 2093.0].forEach((freq, idx) => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, now + idx * 0.09);
            gain.gain.setValueAtTime(0.18, now + idx * 0.09);
            gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.09 + 0.55);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(now + idx * 0.09);
            osc.stop(now + idx * 0.09 + 0.6);
          });
        } catch (e) {}
      }

      function playCatchSound() {
        try {
          const ctx = getAudioCtx();
          if (!ctx) return;
          const now = ctx.currentTime;
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(320, now);
          osc.frequency.exponentialRampToValueAtTime(680, now + 0.15);
          gain.gain.setValueAtTime(0.2, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now);
          osc.stop(now + 0.22);
        } catch (e) {}
      }

      // --- Main Animation Loop ---
      const crankCenterX = 475;
      const crankCenterY = 420;
      const crankRadius = 40;
      const thighLen = 84;
      const shinLen = 96;

      let lastTime = performance.now();

      function animate(now) {
        const dt = Math.min(0.05, (now - lastTime) / 1000);
        lastTime = now;

        if (isPlaying) {
          // Advance crank angle
          const angularVel = 4.2 * speedMultiplier; // rad/sec
          crankAngle += angularVel * dt;
          wheelAngle = (crankAngle * 180) / Math.PI * 1.6;

          // Body vertical bobbing synced to twice the pedal cadence (two strokes per revolution)
          const bodyBobY = Math.sin(crankAngle * 2) * 5.5;
          const bodyTilt = Math.cos(crankAngle * 2) * 1.8 - (speedMultiplier - 1) * 3.5;

          const hipX = 420;
          const hipY = 274 + bodyBobY;

          // 1. Update Pelican Torso & Head
          pelicanBodyGroup.setAttribute(
            'transform',
            `translate(425, ${255 + bodyBobY}) rotate(${bodyTilt.toFixed(2)})`
          );

          // Pouch jiggle (delayed phase from body bob + fish gulp effect)
          const pouchJiggle = Math.sin(crankAngle * 2 - 0.8) * 6;
          const fishExtraPouch = fishAnim.active && fishAnim.t > 0.7 ? Math.sin((fishAnim.t - 0.7) * Math.PI * 3.3) * 14 : 0;
          const pScale = pouchScale + (fishExtraPouch * 0.015);
          pelicanPouch.setAttribute(
            'd',
            `M 12,4 C 22,${(52 * pScale + pouchJiggle).toFixed(1)} 68,${(68 * pScale + pouchJiggle).toFixed(1)} 112,${(42 * pScale + pouchJiggle * 0.6).toFixed(1)} C 138,${(26 * pScale).toFixed(1)} 148,4 152,-6 Z`
          );

          // Head subtle nod
          const headNod = Math.sin(crankAngle * 2 - 0.4) * 2.8;
          pelicanHead.setAttribute('transform', `translate(88, -142) rotate(${headNod.toFixed(2)})`);

          // Tail wag
          const tailWag = Math.sin(crankAngle * 2) * 6;
          pelicanTail.setAttribute('transform', `translate(-42, 10) rotate(${tailWag.toFixed(2)})`);

          // Scarf flutter
          const scarfWave = Math.sin(crankAngle * 4) * 7;
          scarfTail.setAttribute(
            'd',
            `M -10,2 Q -45,${(-12 + scarfWave).toFixed(1)} -75,${(4 - scarfWave).toFixed(1)} Q -50,${(18 + scarfWave).toFixed(1)} -12,8 Z`
          );

          // Wing subtle flex while holding handlebar at (522, 240)
          const shoulderX = 445;
          const shoulderY = 232 + bodyBobY;
          pelicanWing.setAttribute(
            'd',
            `M ${shoulderX},${shoulderY.toFixed(1)} C 425,${(255 + bodyBobY * 0.7).toFixed(1)} 445,${(285 + bodyBobY * 0.5).toFixed(1)} 480,272 C 502,264 514,252 522,240 C 512,232 492,242 475,${(238 + bodyBobY * 0.5).toFixed(1)} C 462,${(235 + bodyBobY * 0.8).toFixed(1)} 455,${(222 + bodyBobY).toFixed(1)} ${shoulderX},${shoulderY.toFixed(1)} Z`
          );
          pelicanWingDetail.setAttribute(
            'd',
            `M 465,${(268 + bodyBobY * 0.4).toFixed(1)} Q 495,262 522,240 Q 505,244 482,${(254 + bodyBobY * 0.4).toFixed(1)}`
          );

          // Periodic eye blink
          const blinkCycle = (now % 3800);
          if (blinkCycle < 140) {
            eyelid.setAttribute('ry', '6.5');
          } else {
            eyelid.setAttribute('ry', '0');
          }

          // 2. Right Leg (Front) IK
          const rPedalX = crankCenterX + crankRadius * Math.cos(crankAngle);
          const rPedalY = crankCenterY + crankRadius * Math.sin(crankAngle);
          const rIK = solveLegIK(hipX, hipY, rPedalX, rPedalY, thighLen, shinLen);

          rCrank.setAttribute('x2', rPedalX.toFixed(1));
          rCrank.setAttribute('y2', rPedalY.toFixed(1));

          rThigh.setAttribute('x1', hipX.toFixed(1));
          rThigh.setAttribute('y1', hipY.toFixed(1));
          rThigh.setAttribute('x2', rIK.kx.toFixed(1));
          rThigh.setAttribute('y2', rIK.ky.toFixed(1));

          rThighInner.setAttribute('x1', hipX.toFixed(1));
          rThighInner.setAttribute('y1', hipY.toFixed(1));
          rThighInner.setAttribute('x2', rIK.kx.toFixed(1));
          rThighInner.setAttribute('y2', rIK.ky.toFixed(1));

          rKnee.setAttribute('cx', rIK.kx.toFixed(1));
          rKnee.setAttribute('cy', rIK.ky.toFixed(1));

          rShin.setAttribute('x1', rIK.kx.toFixed(1));
          rShin.setAttribute('y1', rIK.ky.toFixed(1));
          rShin.setAttribute('x2', rPedalX.toFixed(1));
          rShin.setAttribute('y2', rPedalY.toFixed(1));

          const rFootTilt = Math.sin(crankAngle) * 12;
          rFoot.setAttribute('transform', `translate(${rPedalX.toFixed(1)}, ${rPedalY.toFixed(1)}) rotate(${rFootTilt.toFixed(1)})`);

          // 3. Left Leg (Back - opposite pedal angle + PI) IK
          const lAngle = crankAngle + Math.PI;
          const lPedalX = crankCenterX + crankRadius * Math.cos(lAngle);
          const lPedalY = crankCenterY + crankRadius * Math.sin(lAngle);
          const lIK = solveLegIK(hipX + 4, hipY - 2, lPedalX, lPedalY, thighLen, shinLen);

          lCrank.setAttribute('x2', lPedalX.toFixed(1));
          lCrank.setAttribute('y2', lPedalY.toFixed(1));

          lThigh.setAttribute('x1', (hipX + 4).toFixed(1));
          lThigh.setAttribute('y1', (hipY - 2).toFixed(1));
          lThigh.setAttribute('x2', lIK.kx.toFixed(1));
          lThigh.setAttribute('y2', lIK.ky.toFixed(1));

          lKnee.setAttribute('cx', lIK.kx.toFixed(1));
          lKnee.setAttribute('cy', lIK.ky.toFixed(1));

          lShin.setAttribute('x1', lIK.kx.toFixed(1));
          lShin.setAttribute('y1', lIK.ky.toFixed(1));
          lShin.setAttribute('x2', lPedalX.toFixed(1));
          lShin.setAttribute('y2', lPedalY.toFixed(1));

          const lFootTilt = Math.sin(lAngle) * 12;
          lFoot.setAttribute('transform', `translate(${lPedalX.toFixed(1)}, ${lPedalY.toFixed(1)}) rotate(${lFootTilt.toFixed(1)})`);

          // 4. Rotate Wheels, Chainring & Chain
          rearSpokes.setAttribute('transform', `rotate(${wheelAngle % 360})`);
          frontSpokes.setAttribute('transform', `rotate(${wheelAngle % 360})`);
          chainringSpokes.setAttribute('transform', `rotate(${((crankAngle * 180) / Math.PI) % 360})`);
          bikeChain.setAttribute('stroke-dashoffset', (-crankAngle * 28).toFixed(1));

          // 5. Scroll Parallax Environment
          const scrollPx = 220 * speedMultiplier * dt;
          roadOffset = (roadOffset + scrollPx) % 96;
          roadDashes.setAttribute('transform', `translate(${-roadOffset.toFixed(1)}, 0)`);

          // Railing posts
          const postChildren = railingGroup.querySelectorAll('rect');
          for (let i = 0; i < postPositions.length; i++) {
            postPositions[i] -= scrollPx * 0.75;
            if (postPositions[i] < -20) postPositions[i] += 1140;
            postChildren[i].setAttribute('x', postPositions[i].toFixed(1));
          }

          // Palm trees
          palm1X -= scrollPx * 0.65;
          if (palm1X < -120) palm1X = 1120;
          palm1.setAttribute('transform', `translate(${palm1X.toFixed(1)}, 420)`);

          palm2X -= scrollPx * 0.65;
          if (palm2X < -120) palm2X = 1120;
          palm2.setAttribute('transform', `translate(${palm2X.toFixed(1)}, 420) scale(0.85)`);

          // Clouds
          clouds.forEach((cloud) => {
            const spd = parseFloat(cloud.getAttribute('data-speed') || '0.2');
            let cx = parseFloat(cloud.dataset.cx || cloud.getAttribute('transform').match(/translate\(([^,]+)/)[1]);
            const cy = cloud.dataset.cy || cloud.getAttribute('transform').match(/translate\([^,]+,\s*([^)]+)\)/)[1];
            const scaleMatch = cloud.getAttribute('transform').match(/scale\([^)]+\)/);
            cx -= scrollPx * spd * 0.25;
            if (cx < -160) cx = 1080;
            cloud.dataset.cx = cx;
            cloud.dataset.cy = cy;
            cloud.setAttribute('transform', `translate(${cx.toFixed(1)}, ${cy}) ${scaleMatch ? scaleMatch[0] : ''}`);
          });

          // Ocean Waves
          waves.forEach((w, idx) => {
            let wx = parseFloat(w.getAttribute('data-x'));
            wx -= scrollPx * 0.22;
            if (wx < -100) wx = 1040;
            w.setAttribute('data-x', wx);
            const wy = 385 + (idx % 3) * 11;
            w.setAttribute('d', `M ${wx.toFixed(1)},${wy} Q ${(wx + 20).toFixed(1)},${wy - 7} ${(wx + 40).toFixed(1)},${wy} T ${(wx + 80).toFixed(1)},${wy}`);
          });

          // Seagulls wing flap
          const gullFlap = Math.sin(now * 0.006) * 10;
          gull1.setAttribute('d', `M0,0 Q10,${(-8 + gullFlap).toFixed(1)} 20,0 Q30,${(-8 + gullFlap).toFixed(1)} 40,0`);
          gull2.setAttribute('d', `M0,0 Q10,${(-8 - gullFlap).toFixed(1)} 20,0 Q30,${(-8 - gullFlap).toFixed(1)} 40,0`);

          // Speed lines visibility when sprinting
          speedLines.setAttribute('opacity', speedMultiplier > 1.6 ? ((speedMultiplier - 1.6) * 0.9).toFixed(2) : '0');
        }

        // 6. Fish Feeding Parabolic Animation
        if (fishAnim.active) {
          fishAnim.t += dt * 1.45;
          if (fishAnim.t <= 0.72) {
            const p = fishAnim.t / 0.72; // 0 -> 1 flight into pouch
            const fx = 920 + (605 - 920) * p;
            const fy = 180 + (145 - 180) * p - Math.sin(p * Math.PI) * 120;
            const rot = -35 + p * 110;
            flyingFish.setAttribute('opacity', '1');
            flyingFish.setAttribute('transform', `translate(${fx.toFixed(1)}, ${fy.toFixed(1)}) rotate(${rot.toFixed(1)})`);
          } else if (fishAnim.t <= 1.25) {
            flyingFish.setAttribute('opacity', '0');
            pouchFishBump.setAttribute('opacity', '1');
          } else {
            pouchFishBump.setAttribute('opacity', '0');
            fishAnim.active = false;
          }
        }

        // 7. Bell Ring Animation
        if (bellAnim.active) {
          bellAnim.t += dt * 2.5;
          if (bellAnim.t <= 1.0) {
            const shake = Math.sin(bellAnim.t * 45) * 8;
            bikeBell.setAttribute('transform', `translate(548, 232) rotate(${shake.toFixed(1)})`);
            bellNotes.setAttribute('opacity', (1 - bellAnim.t).toFixed(2));
            bellNotes.setAttribute('transform', `translate(${555 + bellAnim.t * 15}, ${200 - bellAnim.t * 35})`);
          } else {
            bikeBell.setAttribute('transform', 'translate(548, 232)');
            bellNotes.setAttribute('opacity', '0');
            bellAnim.active = false;
          }
        }

        requestAnimationFrame(animate);
      }

      requestAnimationFrame(animate);

      // --- UI Controls Wiring ---
      const btnPlay = document.getElementById('btn-play');
      const playIcon = document.getElementById('play-icon');
      const playText = document.getElementById('play-text');
      const speedSlider = document.getElementById('speed-slider');
      const speedVal = document.getElementById('speed-val');
      const pouchSlider = document.getElementById('pouch-slider');
      const presetBtns = document.querySelectorAll('.preset-btn');

      function updateSpeed(val) {
        speedMultiplier = parseFloat(val);
        speedSlider.value = speedMultiplier;
        speedVal.textContent = speedMultiplier.toFixed(1) + 'x';
        hudRpm.textContent = Math.round(65 * speedMultiplier);
        presetBtns.forEach((b) => {
          if (Math.abs(parseFloat(b.dataset.preset) - speedMultiplier) < 0.15) {
            b.className = 'preset-btn px-2.5 py-1 rounded-lg text-xs font-medium bg-teal-500/20 text-teal-300 transition';
          } else {
            b.className = 'preset-btn px-2.5 py-1 rounded-lg text-xs font-medium text-slate-300 hover:text-white transition';
          }
        });
      }

      btnPlay.addEventListener('click', () => {
        isPlaying = !isPlaying;
        playIcon.textContent = isPlaying ? '⏸' : '▶️';
        playText.textContent = isPlaying ? '暂停' : '继续';
        hudRpm.textContent = isPlaying ? Math.round(65 * speedMultiplier) : 0;
      });

      speedSlider.addEventListener('input', (e) => updateSpeed(e.target.value));
      presetBtns.forEach((btn) => {
        btn.addEventListener('click', () => updateSpeed(btn.dataset.preset));
      });

      pouchSlider.addEventListener('input', (e) => {
        pouchScale = parseFloat(e.target.value);
      });

      // Bell Button
      document.getElementById('btn-bell').addEventListener('click', () => {
        bellAnim.active = true;
        bellAnim.t = 0;
        playBellSound();
      });

      // Feed Fish Button
      document.getElementById('btn-fish').addEventListener('click', () => {
        if (fishAnim.active) return;
        fishAnim.active = true;
        fishAnim.t = 0;
        fishCount++;
        hudFish.textContent = fishCount;
        pouchScale = Math.min(1.45, pouchScale + 0.06);
        pouchSlider.value = pouchScale;
        setTimeout(playCatchSound, 450);
      });

      // Toggle "Study Mode / 自习车" Easter Egg
      const studyAddon = document.getElementById('study-addon');
      const studyGlasses = document.getElementById('study-glasses');
      const modeBadge = document.getElementById('mode-badge');
      const studyLabel = document.getElementById('study-label');

      document.getElementById('btn-study').addEventListener('click', () => {
        studyMode = !studyMode;
        studyAddon.setAttribute('opacity', studyMode ? '1' : '0');
        studyGlasses.setAttribute('opacity', studyMode ? '1' : '0');
        modeBadge.textContent = studyMode ? '📖 自习车模式' : '海滨巡航';
        studyLabel.textContent = studyMode ? '切回普通自行车' : '切换「自习车」彩蛋';
        playBellSound();
      });

      // Theme Toggle (Day / Sunset / Night)
      const skyRect = document.getElementById('sky-rect');
      const starsGroup = document.getElementById('stars-group');
      const headlightBeam = document.getElementById('headlight-beam');
      const celestialBody = document.getElementById('celestial-body');
      const sunCore = document.getElementById('sun-core');
      const themeIcon = document.getElementById('theme-icon');
      const themeLabel = document.getElementById('theme-label');

      document.getElementById('btn-theme').addEventListener('click', () => {
        themeIndex = (themeIndex + 1) % themes.length;
        const t = themes[themeIndex];
        skyRect.setAttribute('fill', t.sky);
        starsGroup.setAttribute('opacity', t.stars);
        headlightBeam.setAttribute('opacity', t.beam);
        celestialBody.setAttribute('transform', `translate(820, ${t.sunY})`);
        sunCore.setAttribute('fill', t.sunColor);
        themeIcon.textContent = t.icon;
        themeLabel.textContent = t.name;
      });
    })();
  </script>
</body>
</html>
